[workspace]
members = ["src-tauri"]

[package]
name = "leagueaccounts"
version = "4.6.12"
edition = "2021"
description = "League of Legends account manager for Windows"
license = "MIT"

[dependencies]
arboard = "3.6"
html-escape = "0.2"
keyring = { version = "3.6", features = ["windows-native"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli"] }
scraper = "0.24"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
time = { version = "0.3", features = ["parsing", "formatting"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
urlencoding = "2.1"
# Game recorder: Windows Graphics Capture, Direct3D 11, Media Foundation, WASAPI.
# 0.62 is already in the tree through Tauri (WebView2), so it costs no download.
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
