<!doctype html>
<html lang="en" data-mode="lol">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>League Companion</title>
    <!-- Startup screen styles; a linked file because Tauri's CSP nonce on <style> would disable inline style attributes. -->
    <link rel="stylesheet" href="/startup.css" />
  </head>
  <body aria-busy="true">
    <div id="startup-loader" role="status" aria-label="Loading League Companion">
      <div id="startup-animation" aria-hidden="true">
        <span class="startup-glow"></span>
        <div class="startup-logo">
          <svg class="startup-mark" viewBox="250 254 726 726">
            <defs>
              <linearGradient id="startup-gold" x1="0.35" y1="0" x2="0.15" y2="1">
                <stop offset="0" stop-color="#fbe08e" /><stop offset="0.45" stop-color="#ebc56c" /><stop offset="1" stop-color="#c38f3c" />
              </linearGradient>
              <linearGradient id="startup-teal" x1="1" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#0a9fb2" /><stop offset="0.5" stop-color="#0fc8d6" /><stop offset="1" stop-color="#079bb0" />
              </linearGradient>
            </defs>
            <path class="startup-piece startup-piece-a" fill="url(#startup-gold)" d="M 933,262 L 425,261 L 257,430 L 258,921 L 390,793 L 390,489 L 465,413 L 786,413 Z" />
            <path class="startup-piece startup-piece-b" fill="url(#startup-teal)" d="M 967,315 L 822,457 L 822,761 L 738,843 L 415,843 L 287,972 L 809,973 L 969,812 Z" />
          </svg>
          <span class="startup-sheen"></span>
        </div>
        <p class="startup-name">League Companion</p>
        <span class="startup-line"><i></i></span>
      </div>
      <div id="startup-error" hidden>
        <p>League Companion couldn't finish loading.</p>
        <button id="startup-retry" type="button">Try again</button>
      </div>
    </div>
    <div class="backdrop" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
    </div>

    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <img src="/icon.png" alt="" class="brand-icon" width="22" height="22" />
        <span class="brand-name" data-tauri-drag-region>League Companion</span>
      </div>
      <div class="mode-switch" role="tablist">
        <span class="mode-pill" aria-hidden="true"></span>
        <button role="tab" data-mode="lol" class="mode-btn"><img src="/league/icons/lol.png" alt="" width="16" height="16" /><span data-i18n="mode.lol"></span></button>
        <button role="tab" data-mode="tft" class="mode-btn"><img src="/league/icons/tft.svg" alt="" width="16" height="16" /><span data-i18n="mode.tft"></span></button>
      </div>
      <div class="window-controls">
        <button class="win-btn win-hide" data-win="minimize" data-i18n-aria="win.minimize"></button>
        <button class="win-btn win-max" data-win="maximize" data-i18n-aria="win.maximize"></button>
        <button class="win-btn win-close" data-win="close" data-i18n-aria="win.close"></button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar">
        <button class="btn btn-primary btn-block" id="open-add">
          <span data-icon="plus"></span> <span data-i18n="side.add"></span>
          <kbd>Ctrl N</kbd>
        </button>

        <nav class="side-tiles">
          <button class="side-tile" data-action="overview"><span data-icon="chart-line"></span><span data-i18n="side.overview"></span></button>
          <button class="side-tile" id="builds-tile" data-action="builds" hidden><span data-icon="swords"></span><span data-i18n="side.builds"></span></button>
          <button class="side-tile" id="recordings-tile" data-action="recordings"><span data-icon="video"></span><span data-i18n="side.recordings"></span></button>
          <button class="side-tile" id="music-tile" data-action="music" hidden><span data-icon="music"></span><span data-i18n="side.music"></span></button>
          <button class="side-tile" data-action="patch-notes"><span data-icon="newspaper"></span><span data-i18n="side.patchNotes"></span></button>
          <button class="side-tile" data-action="game-settings"><span data-icon="sliders"></span><span data-i18n="side.gameSettings"></span></button>
          <button class="side-tile" data-action="settings"><span data-icon="settings"></span><span data-i18n="side.settings"></span></button>
        </nav>

        <section class="side-section">
          <h3 class="side-title" data-i18n="side.distribution"></h3>
          <div id="distribution" class="distribution"></div>
        </section>

        <section class="side-section side-bottom">
          <button id="total-value" class="side-value" hidden data-i18n-title="finder.title">
            <span class="side-value-label"><span data-icon="gem"></span><span data-i18n="value.total"></span></span>
            <span class="side-value-amount"></span>
            <span class="side-value-detail"></span>
          </button>
          <div class="version" id="version"></div>
        </section>
      </aside>

      <main class="main" data-i18n-aria="page.title">
        <header class="collection-header">
          <div>
            <p class="collection-eyebrow" id="queue-label"></p>
            <h1 data-i18n="page.title"></h1>
          </div>
          <div class="collection-summary">
            <div class="summary-pills">
              <button id="remote-note" class="ladder-update remote-pill" data-action="remote" hidden>
                <span class="ladder-update-label"></span><span class="ladder-update-time"></span>
              </button>
              <button class="ladder-update" id="schedule" data-i18n-title="refresh.idle" data-i18n-aria="refresh.idle">
                <span class="ladder-update-label"></span><span class="ladder-update-time"></span>
                <span class="ladder-update-icon" data-icon="refresh-cw"></span>
              </button>
            </div>
            <div class="summary-count">
              <button id="clear-filters" class="text-button" data-i18n="empty.clear" hidden></button>
              <span id="account-count" role="status"></span>
            </div>
          </div>
        </header>
        <div class="toolbar">
          <label class="search">
            <span data-icon="search"></span>
            <input id="search" type="text" data-i18n-ph="toolbar.search" autocomplete="off" spellcheck="false" />
          </label>
          <div class="select-wrap">
            <select id="region-filter" data-i18n-aria="sort.region"></select>
          </div>
          <div class="select-wrap" id="friend-wrap" data-i18n-title="toolbar.friendTitle">
            <span class="select-label" data-i18n="toolbar.friend"></span>
            <select id="friend-tier" data-i18n-aria="toolbar.friend"></select>
            <select id="friend-division" data-i18n-aria="toolbar.friend"></select>
          </div>
          <div class="select-wrap">
            <span class="select-label" data-i18n="toolbar.sort"></span>
            <select id="sort" data-i18n-aria="toolbar.sort">
              <option value="rank" data-i18n="sort.rank"></option>
              <option value="name" data-i18n="sort.name"></option>
              <option value="level" data-i18n="sort.level"></option>
              <option value="region" data-i18n="sort.region"></option>
            </select>
          </div>
          <button class="btn btn-ghost finder-btn" id="open-finder" data-i18n-title="finder.title"><span data-icon="shirt"></span> <span data-i18n="finder.button"></span></button>
          <div class="view-toggle" role="tablist">
            <button data-view="grid" data-i18n-title="view.grid"><span data-icon="layout-grid"></span></button>
            <button data-view="list" data-i18n-title="view.list"><span data-icon="list"></span></button>
          </div>
        </div>

        <div id="accounts" class="accounts grid"></div>
        <div id="empty" class="empty" hidden></div>
      </main>
    </div>

    <div id="drawer-root"></div>
    <div id="modal-root"></div>
    <div id="menu-root"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
